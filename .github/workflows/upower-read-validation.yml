name: UPower read-only validation

on:
  push:
    branches:
      - lab/battery-on-pr985-validation
  workflow_dispatch:

jobs:
  battery_read:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and runtime dependencies
        run: python -m pip install .
      - name: Run isolated UPower integration tests
        run: python -m unittest discover -s internal -p 'test_upower_read.py' -v
      - name: Validate changed Python sources compile
        run: python -m compileall -q auto_cpufreq
