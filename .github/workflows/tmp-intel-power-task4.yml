name: Temporary Intel Power Task 4 Check

on:
  push:
    branches:
      - tmp/intel-power-stage1-task4

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project
        run: python -m pip install .
      - name: Run Intel diagnostics integration check
        run: PYTHONPATH=. python tmp/test_intel_power_task4.py
