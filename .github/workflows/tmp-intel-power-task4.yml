name: Temporary Intel Power Task 4 Check

on:
  push:
    branches:
      - tmp/intel-power-stage1-task4

permissions:
  contents: write

jobs:
  verify:
    if: ${{ !contains(github.event.head_commit.message, 'temp: apply task4 production changes') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project dependencies
        run: python -m pip install .
      - name: Apply production patch
        run: PYTHONPATH=. python tmp/apply_intel_power_task4.py
      - name: Compile changed production files
        run: >-
          python -m compileall -q
          auto_cpufreq/modules/intel_power.py
          auto_cpufreq/modules/system_info.py
          auto_cpufreq/bin/auto_cpufreq.py
      - name: Run Intel diagnostics integration check
        run: PYTHONPATH=. python tmp/test_intel_power_task4.py
      - name: Commit tested production files
        run: |
          git config user.name "Lucas"
          git config user.email "122493239+lucasleocs@users.noreply.github.com"
          git add auto_cpufreq/modules/intel_power.py \
                  auto_cpufreq/modules/system_info.py \
                  auto_cpufreq/bin/auto_cpufreq.py
          git commit -m "temp: apply task4 production changes"
          git push origin HEAD:tmp/intel-power-stage1-task4
