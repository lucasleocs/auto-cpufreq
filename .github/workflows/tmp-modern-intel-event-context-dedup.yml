name: Temporary Modern Intel Event Context Dedup

on:
  push:
    branches:
      - tmp/modern-intel-event-context-dedup

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project dependencies
        run: python -m pip install .
      - name: Apply authoritative context patch
        run: python tmp/apply_event_context_patch.py
      - name: Compile production files
        run: python -m compileall -q auto_cpufreq/core.py auto_cpufreq/bin/auto_cpufreq.py auto_cpufreq/modules/daemon_scheduler.py
      - name: Run event context deduplication checks
        run: PYTHONPATH=. python tmp/test_event_context_dedup.py
      - name: Run daemon context integration checks
        run: PYTHONPATH=. python tmp/test_daemon_context_integration.py
      - name: Commit tested production patch
        run: |
          git config user.name "Lucas"
          git config user.email "122493239+lucasleocs@users.noreply.github.com"
          git add auto_cpufreq/core.py auto_cpufreq/bin/auto_cpufreq.py
          git commit -m "temp-event-context-dedup-production"
          git push origin HEAD:tmp/modern-intel-event-context-dedup
