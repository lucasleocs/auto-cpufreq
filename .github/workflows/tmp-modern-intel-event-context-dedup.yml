name: Temporary Modern Intel Event Context Dedup

on:
  push:
    branches:
      - tmp/modern-intel-event-context-dedup

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project dependencies
        run: python -m pip install .
      - name: Run event context deduplication checks
        run: PYTHONPATH=. python tmp/test_event_context_dedup.py
      - name: Run daemon context integration checks
        run: PYTHONPATH=. python tmp/test_daemon_context_integration.py
