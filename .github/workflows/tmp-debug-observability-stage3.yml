name: Temporary Debug Observability Stage 3

on:
  push:
    branches:
      - tmp/debug-observability-stage3

jobs:
  diagnostics-stage3-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run PPD transport contract
        run: >-
          python -m unittest -v
          tmp_tests.test_debug_observability_stage3.PpdTransportTests
      - name: Run PPD activation contract
        run: >-
          python -m unittest -v
          tmp_tests.test_debug_observability_stage3.PpdIntegrationTests
      - name: Run PPD formatter contract
        run: >-
          python -m unittest -v
          tmp_tests.test_debug_formatter_stage3.PpdFormatterTests
      - name: Verify Python syntax
        run: >-
          python -m py_compile
          auto_cpufreq/modules/diagnostics.py
          auto_cpufreq/bin/auto_cpufreq.py
      - name: Verify Stage 3 diff whitespace
        run: git diff --check 39a4de81baa8a9b2ade09770b5d5515a089f18ee...HEAD
