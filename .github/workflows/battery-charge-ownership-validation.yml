name: Charge ownership validation (experimental)

on:
  push:
    branches:
      - lab/battery-on-pr985-conflict-capability-validation
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install application dependencies
        run: python -m pip install .
      - name: Syntax check
        run: python -m compileall -q auto_cpufreq internal
      - name: Run isolated regression suite
        run: python -m unittest discover -s internal -p 'test_*.py' -v
