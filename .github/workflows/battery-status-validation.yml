name: Battery status validation

on:
  push:
    branches:
      - tmp/battery-status-validation-20261023

permissions:
  contents: read

jobs:
  battery-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_battery_status.py' -v
