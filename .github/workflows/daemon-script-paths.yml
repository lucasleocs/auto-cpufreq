name: Daemon Script Path Tests

on:
  push:
    paths:
      - "auto_cpufreq/core.py"
      - "auto_cpufreq/modules/daemon_script_paths.py"
      - "auto_cpufreq/bin/auto_cpufreq.py"
      - "auto-cpufreq-installer"
      - "tests/test_daemon_script_paths.py"
      - ".github/workflows/daemon-script-paths.yml"
  pull_request:
    paths:
      - "auto_cpufreq/core.py"
      - "auto_cpufreq/modules/daemon_script_paths.py"
      - "auto_cpufreq/bin/auto_cpufreq.py"
      - "auto-cpufreq-installer"
      - "tests/test_daemon_script_paths.py"
      - ".github/workflows/daemon-script-paths.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test script generation pinning and legacy marker
        run: python -m unittest discover -s tests -p 'test_daemon_script_paths.py' -v
