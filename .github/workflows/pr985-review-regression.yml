name: PR 985 Review Regression

on:
  push:
    branches:
      - review/pr985-final-review-fixes
  workflow_dispatch:

jobs:
  review-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated watcher dependency
        run: python -m pip install inotify-simple==2.0.1
      - name: Run review regression tests
        run: python -m unittest discover -s tests -p test_pr985_review_fixes.py -v
