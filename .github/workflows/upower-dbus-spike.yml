name: UPower D-Bus spike (temporary)

on:
  push:
    branches:
      - tmp/upower-dbus-spike-20261023
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install dbus-next==0.2.3
      - run: python -m compileall -q internal/upower_dbus_probe.py internal/test_upower_dbus_probe.py
      - run: python -m unittest discover -s internal -p 'test_upower_dbus_probe.py' -v
      - run: python internal/upower_dbus_probe.py --help
      - name: Headless fallback without UPower
        run: python internal/upower_dbus_probe.py --battery __nonexistent__
