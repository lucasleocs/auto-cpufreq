name: Config Watcher Recovery Tests

on:
  push:
    paths:
      - "auto_cpufreq/config/**"
      - "tests/test_config_watch_recovery.py"
      - ".github/workflows/config-watch-recovery.yml"
  pull_request:
    paths:
      - "auto_cpufreq/config/**"
      - "tests/test_config_watch_recovery.py"
      - ".github/workflows/config-watch-recovery.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install watcher dependency
        run: python -m pip install inotify-simple==2.0.1
      - name: Exercise inotify recovery and reloads
        run: python -m unittest discover -s tests -p test_config_watch_recovery.py -v
