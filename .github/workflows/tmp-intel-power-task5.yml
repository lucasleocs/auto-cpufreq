name: Temporary Intel Power Task 5 Check

on:
  push:
    branches:
      - tmp/intel-power-stage1-task5

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project dependencies
        run: python -m pip install .
      - name: Run stats-only Intel telemetry check
        run: PYTHONPATH=. python tmp/test_intel_power_task5.py
