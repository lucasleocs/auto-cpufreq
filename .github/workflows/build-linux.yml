name: Linux Build

on:
  push:
    paths-ignore:
      - "README.md"
      - ".gitignore"
      - "LICENSE"
  pull_request:

jobs:
  build_linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.1.1
        with:
          fetch-depth: 0

      - name: Install poetry
        run: pipx install poetry

      - name: "Setup Python"
        uses: actions/setup-python@v5.0.0
        with:
          python-version: 3.12
          cache: "poetry"

      - name: "Install auto-cpufreq"
        run: sudo ./auto-cpufreq-installer --install

      - name: "Live service regression tests (mocked systemctl)"
        run: /opt/auto-cpufreq/current/venv/bin/python -m unittest discover -s tests -p "test_*power*.py" -v
      
