name: Linux Build

on:
  push:
    paths-ignore:
      - "README.md"
      - ".gitignore"
      - "LICENSE"
  pull_request:

jobs:
  build_linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.1.1

      - name: Install poetry
        run: pipx install poetry

      - name: "Setup Python"
        uses: actions/setup-python@v5.0.0
        with:
          python-version: 3.12
          cache: "poetry"

      - name: Test daemon lifecycle scripts
        run: sudo bash tests/test-daemon-lifecycle.sh

      - name: Test source installer failure propagation
        run: sudo bash tests/test-source-installer.sh

      - name: Test cpufreqctl CPU topology handling
        run: sudo bash tests/test-cpufreqctl-topology.sh

      - name: "Install auto-cpufreq"
        run: sudo ./auto-cpufreq-installer --install

      - name: Run Python regression tests
        run: sudo /opt/auto-cpufreq/venv/bin/python -m unittest discover -s tests -p "test_*.py" -v
