name: Linux Build

on:
  push:
    paths-ignore:
      - "README.md"
      - ".gitignore"
      - "LICENSE"
  pull_request:

jobs:
  build_linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.1.1

      - name: Install poetry
        run: pipx install poetry

      - name: "Setup Python"
        uses: actions/setup-python@v5.0.0
        with:
          python-version: 3.12
          cache: "poetry"

      - name: "Apply PR 965 candidate patch"
        run: |
          git apply --check audit/pr965_minimal_update.patch
          git apply audit/pr965_minimal_update.patch

      - name: "Install auto-cpufreq"
        run: sudo ./auto-cpufreq-installer --install

      - name: "PR 965 minimal updater regression"
        run: /opt/auto-cpufreq/venv/bin/python audit/pr965_minimal_update_regression.py
