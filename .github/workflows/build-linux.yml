name: Linux Build

on:
  push:
    paths-ignore:
      - "README.md"
      - ".gitignore"
      - "LICENSE"
  pull_request:

jobs:
  python_compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.1.1

      - name: "Setup Python 3.10"
        uses: actions/setup-python@v5.0.0
        with:
          python-version: "3.10"

      - name: "Check Python 3.10 syntax"
        run: python -m compileall -q auto_cpufreq

  build_linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.1.1

      - name: Install poetry
        run: pipx install poetry

      - name: "Setup Python"
        uses: actions/setup-python@v5.0.0
        with:
          python-version: 3.12
          cache: "poetry"

      - name: "Install auto-cpufreq"
        run: sudo ./auto-cpufreq-installer --install
      
