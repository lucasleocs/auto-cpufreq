name: Linux Build

on:
  push:
    paths-ignore:
      - "README.md"
      - ".gitignore"
      - "LICENSE"
  pull_request:

permissions:
  contents: write

jobs:
  build_linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.1.1

      - name: Install poetry
        run: pipx install poetry

      - name: "Setup Python"
        uses: actions/setup-python@v5.0.0
        with:
          python-version: 3.12
          cache: "poetry"

      - name: "Apply PR 965 candidate"
        run: |
          python3 audit/apply_pr965_minimal_update.py
          python3 audit/apply_pr965_source_guard.py

      - name: "Install auto-cpufreq"
        run: sudo ./auto-cpufreq-installer --install

      - name: "PR 965 minimal updater regression"
        run: /opt/auto-cpufreq/venv/bin/python audit/pr965_minimal_update_regression.py

      - name: "Verify candidate syntax and diff"
        run: |
          /opt/auto-cpufreq/venv/bin/python -m compileall -q auto_cpufreq
          bash -n auto-cpufreq-installer
          bash -n scripts/auto-cpufreq-install.sh
          bash -n scripts/auto-cpufreq-remove.sh
          git diff --check HEAD -- auto-cpufreq-installer auto_cpufreq/core.py auto_cpufreq/bin/auto_cpufreq.py

      - name: "Materialize validated updater candidate"
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B stage/pr965-materialized-candidate
          git add auto-cpufreq-installer auto_cpufreq/core.py auto_cpufreq/bin/auto_cpufreq.py
          git commit -m "wip: materialize validated updater candidate [skip ci]"
          git push --force origin HEAD:stage/pr965-materialized-candidate
