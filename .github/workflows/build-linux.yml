name: Linux Build

on:
  push:
    paths-ignore:
      - "README.md"
      - ".gitignore"
      - "LICENSE"
  pull_request:

permissions:
  contents: write

jobs:
  build_linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.1.1

      - name: "Apply candidate battery power fix"
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("auto_cpufreq/modules/system_info.py")
          text = path.read_text()

          marker = '''    @staticmethod
          def battery_info() -> BatteryInfo:
          '''
          helper = '''    @staticmethod
          def _battery_power_watts(battery_path: str) -> float | None:
              """Return instantaneous battery power magnitude in watts when available."""
              power_now = SystemInfo.read_file(os.path.join(battery_path, "power_now"))
              if power_now is not None:
                  try:
                      return abs(int(power_now)) / 1_000_000
                  except ValueError:
                      return None

              current_now = SystemInfo.read_file(os.path.join(battery_path, "current_now"))
              voltage_now = SystemInfo.read_file(os.path.join(battery_path, "voltage_now"))
              if current_now is None or voltage_now is None:
                  return None

              try:
                  return abs(int(current_now) * int(voltage_now)) / 1_000_000_000_000
              except ValueError:
                  return None

              @staticmethod
              def battery_info() -> BatteryInfo:
          '''

          # The triple-quoted replacement above is deliberately de-indented below;
          # keep the production source indentation exact.
          helper = helper.replace("              @staticmethod\n              def battery_info", "    @staticmethod\n    def battery_info")

          if "def _battery_power_watts" not in text:
              if marker not in text:
                  raise SystemExit("battery_info marker not found")
              text = text.replace(marker, helper, 1)

          old_collection = '''        # first check for wattage in power_now
                  # this is not found on all laptops
                  energy_rate = (
                      SystemInfo.read_file(os.path.join(battery_path, "power_now"))
                  )

                  # if power_now wasn't found, try calculating wattage using current and voltage
                  if energy_rate is None:
                      current = SystemInfo.read_file(os.path.join(battery_path, "current_now"))
                      voltage = SystemInfo.read_file(os.path.join(battery_path, "voltage_now"))

                      if (current and current.isdigit()) and (voltage and voltage.isdigit()):
                          energy_rate = (int(current) * int(voltage)) / 1_000_000



          '''
          old_collection = old_collection.replace("                  ", "        ")
          if old_collection in text:
              text = text.replace(
                  old_collection,
                  '        power_consumption = SystemInfo._battery_power_watts(battery_path)\n\n',
                  1,
              )

          old_conversion = '''        power_consumption = float(energy_rate) / 1_000_000 if energy_rate \\
                      and str(energy_rate).replace('.', '', 1).isdigit() else None
          '''
          old_conversion = old_conversion.replace("                      ", "            ")
          if old_conversion in text:
              text = text.replace(old_conversion, "", 1)

          if "energy_rate" in text[text.index("def battery_info"):text.index("def turbo_on_suggestion")]:
              raise SystemExit("legacy energy_rate logic still present")

          path.write_text(text)
          PY

      - name: Install poetry
        run: pipx install poetry

      - name: "Setup Python"
        uses: actions/setup-python@v5.0.0
        with:
          python-version: 3.12
          cache: "poetry"

      - name: "Install auto-cpufreq"
        run: sudo ./auto-cpufreq-installer --install

      - name: "Battery power regression tests"
        run: /opt/auto-cpufreq/venv/bin/python -m unittest scripts/test_battery_power_reporting.py -v

      - name: "Commit verified candidate"
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix-battery-power-reporting-tdd'
        run: |
          if git diff --quiet -- auto_cpufreq/modules/system_info.py; then
            exit 0
          fi
          git config user.name "Lucas"
          git config user.email "122493239+lucasleocs@users.noreply.github.com"
          git add auto_cpufreq/modules/system_info.py
          git commit -m "fix: correct battery power reporting"
          git push origin HEAD:fix-battery-power-reporting-tdd
