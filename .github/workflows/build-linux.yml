name: Linux Build

on:
  push:
    paths-ignore:
      - "README.md"
      - ".gitignore"
      - "LICENSE"
  pull_request:

jobs:
  build_linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.1.1

      - name: Install poetry
        run: pipx install poetry

      - name: "Setup Python"
        uses: actions/setup-python@v5.0.0
        with:
          python-version: 3.12
          cache: "poetry"

      - name: "Run focused PR965 regression harness"
        run: python3 audit/pr965_regression_harness_v5.py

      - name: "Validate changed code"
        run: |
          python3 -m py_compile auto_cpufreq/update.py auto_cpufreq/core.py auto_cpufreq/power_helper.py auto_cpufreq/bin/auto_cpufreq.py
          bash -n scripts/auto-cpufreq-install.sh
          bash -n scripts/auto-cpufreq-remove.sh
          git fetch --no-tags --depth=1 origin master
          git diff --check FETCH_HEAD..HEAD -- . ':(exclude)auto_cpufreq/bin/auto_cpufreq.py'

      - name: "Install auto-cpufreq"
        run: sudo ./auto-cpufreq-installer --install
      
