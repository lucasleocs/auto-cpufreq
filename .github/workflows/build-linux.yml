name: Linux Build

on:
  push:
    paths-ignore:
      - "README.md"
      - ".gitignore"
      - "LICENSE"
  pull_request:

permissions:
  contents: write

jobs:
  build_linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.1.1

      - name: "Apply candidate battery power fix"
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("auto_cpufreq/modules/system_info.py")
          text = path.read_text()

          marker = "    @staticmethod\n    def battery_info() -> BatteryInfo:\n"
          helper = (
              "    @staticmethod\n"
              "    def _battery_power_watts(battery_path: str) -> float | None:\n"
              "        \"\"\"Return instantaneous battery power magnitude in watts when available.\"\"\"\n"
              "        power_now = SystemInfo.read_file(os.path.join(battery_path, \"power_now\"))\n"
              "        if power_now is not None:\n"
              "            try:\n"
              "                return abs(int(power_now)) / 1_000_000\n"
              "            except ValueError:\n"
              "                return None\n"
              "\n"
              "        current_now = SystemInfo.read_file(os.path.join(battery_path, \"current_now\"))\n"
              "        voltage_now = SystemInfo.read_file(os.path.join(battery_path, \"voltage_now\"))\n"
              "        if current_now is None or voltage_now is None:\n"
              "            return None\n"
              "\n"
              "        try:\n"
              "            return abs(int(current_now) * int(voltage_now)) / 1_000_000_000_000\n"
              "        except ValueError:\n"
              "            return None\n"
              "\n"
              + marker
          )

          if "def _battery_power_watts" not in text:
              if marker not in text:
                  raise SystemExit("battery_info marker not found")
              text = text.replace(marker, helper, 1)

          legacy_start = "        # first check for wattage in power_now\n"
          collection_end = "        charge_start_threshold = (\n"
          if legacy_start in text:
              start = text.index(legacy_start)
              end = text.index(collection_end, start)
              text = (
                  text[:start]
                  + "        power_consumption = SystemInfo._battery_power_watts(battery_path)\n\n"
                  + text[end:]
              )

          old_conversion = (
              "        power_consumption = float(energy_rate) / 1_000_000 if energy_rate "
              + "\\"
              + "\n"
              + "            and str(energy_rate).replace('.', '', 1).isdigit() else None\n"
          )
          if old_conversion in text:
              text = text.replace(old_conversion, "", 1)

          battery_section = text[text.index("def battery_info"):text.index("def turbo_on_suggestion")]
          if "energy_rate" in battery_section:
              raise SystemExit("legacy energy_rate logic still present")
          if "power_consumption = SystemInfo._battery_power_watts(battery_path)" not in battery_section:
              raise SystemExit("new battery power collection not installed")

          path.write_text(text)
          PY

      - name: Install poetry
        run: pipx install poetry

      - name: "Setup Python"
        uses: actions/setup-python@v5.0.0
        with:
          python-version: 3.12
          cache: "poetry"

      - name: "Install auto-cpufreq"
        run: sudo ./auto-cpufreq-installer --install

      - name: "Battery power regression tests"
        run: /opt/auto-cpufreq/venv/bin/python -m unittest scripts/test_battery_power_reporting.py -v

      - name: "Commit verified candidate"
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix-battery-power-reporting-tdd'
        run: |
          if git diff --quiet -- auto_cpufreq/modules/system_info.py; then
            exit 0
          fi
          git config user.name "Lucas"
          git config user.email "122493239+lucasleocs@users.noreply.github.com"
          git add auto_cpufreq/modules/system_info.py
          git commit -m "fix: correct battery power reporting"
          git push origin HEAD:fix-battery-power-reporting-tdd
