name: Battery policy safety tests (lab only)

on:
  push:
    branches:
      - lab/battery-on-pr985-policy-safety-validation
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install .
      - name: Check Python source syntax
        run: python -m compileall -q auto_cpufreq internal
      - name: Run mock battery policy tests
        run: python -m unittest discover -s internal -p 'test_*.py' -v
