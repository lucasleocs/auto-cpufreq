name: Temporary Python 3.9 compatibility fix

on:
  push:
    branches:
      - tmp/975-final-hardening

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/975-final-hardening

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Restore installer compatibility
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          installer = Path('auto-cpufreq-installer')
          text = installer.read_text()
          text = text.replace('Python 3.10 or newer', 'Python 3.9 or newer')
          text = text.replace('Python 3.10+ with', 'Python 3.9+ with')
          text = text.replace('sys.version_info >= (3, 10)', 'sys.version_info >= (3, 9)')
          text = text.replace(
              'GLib $glib_version is too old for the supported Python 3.12 PyGObject path.',
              'GLib $glib_version is too old for the supported PyGObject compatibility path.',
          )
          old = '''      case "$EL_MAJOR" in
        8|9)
          PYTHON_BIN="/usr/bin/python3.12"
          RPM_PYTHON_PACKAGES=(python3.12 python3.12-devel python3.12-pip)
          ;;
        10)
          # RHEL 10 uses Python 3.12 as the default /usr/bin/python3.
          PYTHON_BIN="/usr/bin/python3"
          RPM_PYTHON_PACKAGES=(python3 python3-devel python3-pip)
          ;;
'''
          new = '''      case "$EL_MAJOR" in
        8)
          PYTHON_BIN="/usr/bin/python3.9"
          RPM_PYTHON_PACKAGES=(python39 python39-devel python39-pip)
          ;;
        9|10)
          PYTHON_BIN="/usr/bin/python3"
          RPM_PYTHON_PACKAGES=(python3 python3-devel python3-pip)
          ;;
'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Enterprise Linux Python selector is not in a recognized state')
          installer.write_text(text)
          PY

          bash -n auto-cpufreq-installer

      - name: Regenerate Poetry lock file
        shell: bash
        run: |
          set -euo pipefail
          pipx install poetry==2.2.1
          poetry lock
          poetry check --lock

      - name: Commit compatibility changes when needed
        shell: bash
        run: |
          set -euo pipefail
          git add auto-cpufreq-installer poetry.lock
          if git diff --cached --quiet; then
            echo 'Installer and lock file are already compatible with Python 3.9'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'tmp: restore Python 3.9 installer compatibility'
          git push origin HEAD:tmp/975-final-hardening
