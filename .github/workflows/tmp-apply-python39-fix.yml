name: Temporary Python 3.9 compatibility fix

on:
  push:
    branches:
      - tmp/975-final-hardening

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/975-final-hardening

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Apply Python 3.9 compatibility changes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          lifecycle = Path('auto_cpufreq/lifecycle.py')
          text = lifecycle.read_text()
          old = 'from subprocess import run\n\nfrom requests'
          new = 'from subprocess import run\nfrom typing import Optional\n\nfrom requests'
          if old not in text:
              raise SystemExit('lifecycle import anchor not found')
          text = text.replace(old, new, 1)
          old = 'def _installed_source_version() -> str | None:'
          new = 'def _installed_source_version() -> Optional[str]:'
          if old not in text:
              raise SystemExit('lifecycle Python 3.10 annotation anchor not found')
          lifecycle.write_text(text.replace(old, new, 1))

          installer = Path('auto-cpufreq-installer')
          text = installer.read_text()
          text = text.replace('Python 3.10 or newer', 'Python 3.9 or newer')
          text = text.replace('sys.version_info >= (3, 10)', 'sys.version_info >= (3, 9)')
          text = text.replace(
              'GLib $glib_version is too old for the supported Python 3.12 PyGObject path.',
              'GLib $glib_version is too old for the supported PyGObject compatibility path.',
          )
          old = '''      case "$EL_MAJOR" in
        8|9)
          PYTHON_BIN="/usr/bin/python3.12"
          RPM_PYTHON_PACKAGES=(python3.12 python3.12-devel python3.12-pip)
          ;;
        10)
          # RHEL 10 uses Python 3.12 as the default /usr/bin/python3.
          PYTHON_BIN="/usr/bin/python3"
          RPM_PYTHON_PACKAGES=(python3 python3-devel python3-pip)
          ;;
'''
          new = '''      case "$EL_MAJOR" in
        8)
          PYTHON_BIN="/usr/bin/python3.9"
          RPM_PYTHON_PACKAGES=(python39 python39-devel python39-pip)
          ;;
        9|10)
          PYTHON_BIN="/usr/bin/python3"
          RPM_PYTHON_PACKAGES=(python3 python3-devel python3-pip)
          ;;
'''
          if old not in text:
              raise SystemExit('Enterprise Linux Python selector anchor not found')
          installer.write_text(text.replace(old, new, 1))
          PY

          bash -n auto-cpufreq-installer
          python -m py_compile \
            auto_cpufreq/daemon_preflight.py \
            auto_cpufreq/installation.py \
            auto_cpufreq/lifecycle.py \
            auto_cpufreq/operation_lock.py \
            auto_cpufreq/release_update.py

      - name: Regenerate Poetry lock file
        shell: bash
        run: |
          set -euo pipefail
          pipx install poetry==2.2.1
          poetry lock
          poetry check --lock

      - name: Commit compatibility changes
        shell: bash
        run: |
          set -euo pipefail
          git add auto-cpufreq-installer auto_cpufreq/lifecycle.py poetry.lock
          if git diff --cached --quiet; then
            echo 'No compatibility changes were needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'tmp: restore Python 3.9 compatibility'
          git push origin HEAD:tmp/975-final-hardening
