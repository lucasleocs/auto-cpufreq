name: Temporary Modern Intel Event Loop Stage 4

on:
  push:
    branches:
      - tmp/modern-intel-event-loop-stage4

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project dependencies
        run: python -m pip install .
      - name: Apply daemon event-loop integration patch
        run: PYTHONPATH=. python tmp/apply_event_loop_integration.py
      - name: Compile production files
        run: python -m compileall -q auto_cpufreq/modules/daemon_scheduler.py auto_cpufreq/modules/policy.py auto_cpufreq/config/config.py auto_cpufreq/bin/auto_cpufreq.py
      - name: Check systemd watchdog configuration
        run: grep -Fx 'WatchdogSec=30s' scripts/auto-cpufreq.service
      - name: Run scheduler behavior checks
        run: PYTHONPATH=. python tmp/test_daemon_scheduler.py
      - name: Run daemon event integration checks
        run: PYTHONPATH=. python tmp/test_daemon_event_integration.py
      - name: Commit tested production patch
        run: |
          git config user.name "Lucas"
          git config user.email "122493239+lucasleocs@users.noreply.github.com"
          git add auto_cpufreq/bin/auto_cpufreq.py scripts/auto-cpufreq.service
          if git diff --cached --quiet; then
            echo "Production integration already committed"
            exit 0
          fi
          git commit -m "temp-event-loop-integration-production"
          git push origin HEAD:tmp/modern-intel-event-loop-stage4
