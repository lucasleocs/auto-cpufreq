name: Temporary Modern Intel Event Loop Stage 4

on:
  push:
    branches:
      - tmp/modern-intel-event-loop-stage4

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project dependencies
        run: python -m pip install .
      - name: Run scheduler behavior checks
        run: PYTHONPATH=. python tmp/test_daemon_scheduler.py
      - name: Run daemon event integration checks
        run: PYTHONPATH=. python tmp/test_daemon_event_integration.py
