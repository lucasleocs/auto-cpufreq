name: Battery audit fixes validation (lab)

on:
  push:
    branches:
      - lab/battery-on-pr985-audit-fixes2-validation
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime
        run: python -m pip install .
      - name: Validate syntax
        run: python -m compileall -q auto_cpufreq internal
      - name: Run isolated battery and policy tests
        run: python -m unittest discover -s internal -p 'test_*.py' -v
