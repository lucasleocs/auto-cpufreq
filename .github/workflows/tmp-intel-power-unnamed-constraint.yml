name: Temporary Intel Power Unnamed Constraint Check

on:
  push:
    branches:
      - tmp/intel-power-unnamed-constraint

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project dependencies
        run: python -m pip install .
      - name: Apply production fix
        run: PYTHONPATH=. python tmp/apply_unnamed_constraint_fix.py
      - name: Compile production file
        run: python -m compileall -q auto_cpufreq/modules/intel_power.py
      - name: Run unnamed constraint check
        run: PYTHONPATH=. python tmp/test_intel_power_unnamed_constraint.py
      - name: Run existing Powercap regression check
        run: PYTHONPATH=. python tmp/test_intel_power_task2.py
      - name: Commit tested production file
        run: |
          git config user.name "Lucas"
          git config user.email "122493239+lucasleocs@users.noreply.github.com"
          git add auto_cpufreq/modules/intel_power.py
          git commit -m "temp-unnamed-constraint-production"
          git push origin HEAD:tmp/intel-power-unnamed-constraint
