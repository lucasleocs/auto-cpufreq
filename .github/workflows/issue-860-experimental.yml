name: Issue 860 Runtime Regression

on:
  push:
    branches:
      - test/issue-860-runtime-20261023
    paths:
      - tests/regression/issue_860/**
      - auto_cpufreq/gui/**
      - auto_cpufreq/config/**
      - auto_cpufreq/modules/**
      - auto_cpufreq/core.py
      - auto_cpufreq/bin/auto_cpufreq.py
      - auto_cpufreq/bin/auto_cpufreq_gtk.py
      - .github/workflows/issue-860-experimental.yml
      - pyproject.toml
      - poetry.lock
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stats-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install terminal UI and inotify-simple
        run: python -m pip install 'urwid>=3.0.2,<5.0.0' 'inotify-simple==2.0.1'
      - name: Compile regression test
        run: python -m compileall -q auto_cpufreq tests/regression/issue_860
      - name: Exercise terminal lifecycle
        run: python -m unittest discover -s tests/regression/issue_860 -p 'test_*.py' -v
      - name: Benchmark Urwid report formatting (synthetic baseline)
        run: python tests/regression/issue_860/bench_urwid_render.py
      - name: Benchmark Linux process sampler overhead
        run: python tests/regression/issue_860/bench_process_health.py

  gtk-refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK and virtual display
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-gi python3-venv gir1.2-gtk-3.0 gir1.2-gdkpixbuf-2.0 xvfb xauth
          /usr/bin/python3 -m venv --system-site-packages "$RUNNER_TEMP/gtk-test-env"
          "$RUNNER_TEMP/gtk-test-env/bin/pip" install 'inotify-simple==2.0.1'
      - name: Compile GTK regression test
        run: |
          "$RUNNER_TEMP/gtk-test-env/bin/python" -m compileall -q auto_cpufreq tests/regression/issue_860
      - name: Exercise GLib refresh and worker cleanup
        run: xvfb-run -a "$RUNNER_TEMP/gtk-test-env/bin/python" -m unittest discover -s tests/regression/issue_860 -p 'gtk_*_checks.py' -v
      - name: Benchmark GTK row rebuild (synthetic baseline)
        run: xvfb-run -a "$RUNNER_TEMP/gtk-test-env/bin/python" tests/regression/issue_860/bench_gtk_render.py
