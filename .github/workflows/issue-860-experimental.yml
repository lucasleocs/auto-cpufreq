name: Issue 860 Runtime Regression

on:
  push:
    branches:
      - test/issue-860-runtime-20261023
    paths:
      - tests/regression/issue_860/**
      - auto_cpufreq/gui/**
      - auto_cpufreq/config/**
      - auto_cpufreq/modules/diagnostics.py
      - auto_cpufreq/modules/process_health.py
      - auto_cpufreq/modules/report_presentation.py
      - auto_cpufreq/modules/report_refresh.py
      - auto_cpufreq/modules/system_monitor.py
      - auto_cpufreq/core.py
      - auto_cpufreq/bin/auto_cpufreq.py
      - auto_cpufreq/bin/auto_cpufreq_gtk.py
      - .github/workflows/issue-860-experimental.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stats-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated terminal UI and locked inotify fork
        run: |
          python -m pip install 'urwid>=3.0.2,<5.0.0' 'pyasyncore>=1.0.4'
          python -m pip install 'git+https://github.com/shadeyg56/pyinotify-3.12@271b7aba3269116b6c3870355393f47c79bce146'
      - name: Compile regression test
        run: python -m py_compile auto_cpufreq/config/config.py auto_cpufreq/config/config_event_handler.py auto_cpufreq/modules/process_health.py auto_cpufreq/modules/diagnostics.py auto_cpufreq/modules/report_presentation.py auto_cpufreq/modules/report_refresh.py tests/regression/issue_860/test_config_reload.py tests/regression/issue_860/test_report_presentation.py tests/regression/issue_860/test_report_refresh.py tests/regression/issue_860/test_shared_diagnostics.py tests/regression/issue_860/test_stats_lifecycle.py tests/regression/issue_860/sample_process.py tests/regression/issue_860/test_sampler.py
      - name: Exercise terminal lifecycle
        run: python -m unittest discover -s tests/regression/issue_860 -p 'test_*.py' -v
      - name: Benchmark Urwid report formatting (synthetic baseline)
        run: python tests/regression/issue_860/bench_urwid_render.py
      - name: Benchmark Linux process sampler overhead
        run: python tests/regression/issue_860/bench_process_health.py

  gtk-refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK and virtual display
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-gi gir1.2-gtk-3.0 gir1.2-gdkpixbuf-2.0 xvfb xauth
      - name: Compile GTK regression test
        run: /usr/bin/python3 -m py_compile auto_cpufreq/modules/process_health.py auto_cpufreq/modules/report_refresh.py auto_cpufreq/modules/report_presentation.py auto_cpufreq/modules/diagnostics.py auto_cpufreq/gui/diagnostics.py auto_cpufreq/gui/app.py auto_cpufreq/gui/objects.py auto_cpufreq/bin/auto_cpufreq_gtk.py tests/regression/issue_860/gtk_refresh_checks.py tests/regression/issue_860/gtk_logging_ui_checks.py
      - name: Exercise GLib refresh and worker cleanup
        run: xvfb-run -a /usr/bin/python3 -m unittest discover -s tests/regression/issue_860 -p 'gtk_*_checks.py' -v
      - name: Benchmark GTK row rebuild (synthetic baseline)
        run: xvfb-run -a /usr/bin/python3 tests/regression/issue_860/bench_gtk_render.py
