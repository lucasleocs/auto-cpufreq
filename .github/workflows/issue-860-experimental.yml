name: Issue 860 Runtime Regression

on:
  push:
    branches:
      - test/issue-860-runtime-20261023
    paths:
      - tests/regression/issue_860/**
      - .github/workflows/issue-860-experimental.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stats-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated terminal UI dependency
        run: python -m pip install 'urwid>=3.0.2,<5.0.0'
      - name: Compile regression test
        run: python -m py_compile tests/regression/issue_860/test_stats_lifecycle.py
      - name: Exercise terminal lifecycle
        run: python -m unittest discover -s tests/regression/issue_860 -p 'test_stats_lifecycle.py' -v

  gtk-refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK and virtual display
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-gi gir1.2-gtk-3.0 gir1.2-gdkpixbuf-2.0 xvfb xauth
      - name: Compile GTK regression test
        run: /usr/bin/python3 -m py_compile tests/regression/issue_860/gtk_refresh_checks.py
      - name: Exercise GLib refresh and worker cleanup
        run: xvfb-run -a /usr/bin/python3 -m unittest discover -s tests/regression/issue_860 -p 'gtk_refresh_checks.py' -v
