name: UPower capability and presentation validation (lab)

on:
  push:
    branches:
      - lab/battery-on-pr985-upower-presentation-validation
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install .
      - name: Syntax check
        run: python -m compileall -q auto_cpufreq internal
      - name: Mocked battery regression suite
        run: python -m unittest discover -s internal -p 'test_*.py' -v
