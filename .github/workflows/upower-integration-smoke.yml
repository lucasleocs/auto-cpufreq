name: UPower installed-package smoke (temporary)

on:
  push:
    branches:
      - tmp/upower-reporting-integration-20261023
  workflow_dispatch:

jobs:
  installed-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package in ephemeral venv
        run: python -m pip install -e .
      - name: Assert D-Bus client is installed
        run: python -c 'import dbus_next; import auto_cpufreq.modules.battery_upower'
      - name: Run battery-report integration tests
        run: python -m unittest discover -s internal -p 'test_upower_system_info.py' -v
      - name: Confirm sysfs fallback without physical battery
        run: |
          python - <<'PY'
          from auto_cpufreq.modules.system_info import SystemInfo
          battery = SystemInfo.battery_info()
          print("status:", battery)
          print("source:", battery.source)
          PY
