name: Temporary Intel Policy Stage 2

on:
  push:
    branches:
      - tmp/intel-policy-stage2

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project dependencies
        run: python -m pip install .
      - name: Apply production patch
        run: PYTHONPATH=. python tmp/apply_policy_core_patch.py
      - name: Compile production files
        run: python -m compileall -q auto_cpufreq/core.py auto_cpufreq/modules/policy.py
      - name: Run policy backend contract checks
        run: PYTHONPATH=. python tmp/test_policy_stage2.py
      - name: Run policy dispatcher integration checks
        run: PYTHONPATH=. python tmp/test_policy_core_integration.py
      - name: Commit tested production patch
        run: |
          if git diff --quiet -- auto_cpufreq/core.py; then
            echo "Production patch already committed"
            exit 0
          fi
          git config user.name "Lucas"
          git config user.email "122493239+lucasleocs@users.noreply.github.com"
          git add auto_cpufreq/core.py
          git commit -m "temp-policy-core-production"
          git push origin HEAD:tmp/intel-policy-stage2
