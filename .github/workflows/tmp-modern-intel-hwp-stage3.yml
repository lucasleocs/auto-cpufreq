name: Temporary Modern Intel HWP Stage 3

on:
  push:
    branches:
      - tmp/modern-intel-hwp-stage3

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project dependencies
        run: python -m pip install .
      - name: Run Modern Intel action routing checks
        run: PYTHONPATH=. python tmp/test_modern_policy_actions.py
      - name: Run Modern Intel HWP core behavior checks
        run: PYTHONPATH=. python tmp/test_modern_hwp_core.py
