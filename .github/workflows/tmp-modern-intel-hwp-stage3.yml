name: Temporary Modern Intel HWP Stage 3

on:
  push:
    branches:
      - tmp/modern-intel-hwp-stage3

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project dependencies
        run: python -m pip install .
      - name: Apply Modern Intel HWP core patch
        run: PYTHONPATH=. python tmp/apply_modern_hwp_core_patch.py
      - name: Compile production files
        run: python -m compileall -q auto_cpufreq/core.py auto_cpufreq/modules/policy.py
      - name: Run Modern Intel action routing checks
        run: PYTHONPATH=. python tmp/test_modern_policy_actions.py
      - name: Run Modern Intel HWP core behavior checks
        run: PYTHONPATH=. python tmp/test_modern_hwp_core.py
      - name: Run Modern Intel dispatcher behavior checks
        run: PYTHONPATH=. python tmp/test_modern_hwp_dispatch.py
