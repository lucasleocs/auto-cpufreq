name: Runit Ownership Regression

on:
  push:
    paths:
      - "scripts/auto-cpufreq-install.sh"
      - "scripts/auto-cpufreq-remove.sh"
      - "tests/test_runit_service_ownership.py"
      - ".github/workflows/runit-ownership-tests.yml"
  pull_request:
    paths:
      - "scripts/auto-cpufreq-install.sh"
      - "scripts/auto-cpufreq-remove.sh"
      - "tests/test_runit_service_ownership.py"
      - ".github/workflows/runit-ownership-tests.yml"

jobs:
  ownership:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check shell syntax and run isolated Runit ownership tests
        run: |
          bash -n scripts/auto-cpufreq-install.sh scripts/auto-cpufreq-remove.sh
          python -m unittest discover -s tests -p 'test_runit_service_ownership.py' -v
