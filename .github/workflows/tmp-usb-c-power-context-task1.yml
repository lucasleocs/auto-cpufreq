name: Temporary USB-C Power Context Task 5 TDD

on:
  push:
    branches:
      - tmp/usb-c-power-context-tdd

permissions:
  contents: write

jobs:
  task5:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: usb-c-power-context
          fetch-depth: 0

      - name: Prepare project Python environment
        run: python -m pip install -e .

      - name: RED - reporting tests must fail before implementation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/auto-cpufreq-power-context-tests
          cat > /tmp/auto-cpufreq-power-context-tests/test_power_context_reporting.py <<'PY'
          import unittest
          from pathlib import Path

          from auto_cpufreq.modules.power_context import (
              BatteryFlow,
              ExternalPower,
              PowerContextSnapshot,
              PowerSupplySnapshot,
          )
          from auto_cpufreq.modules.sysfs import ReadResult, ReadStatus
          from auto_cpufreq.modules.system_info import (
              format_power_context_debug,
              format_power_context_summary,
          )

          A = ReadStatus.AVAILABLE
          M = ReadStatus.MISSING


          class ReportingTests(unittest.TestCase):
              def snapshot(self):
                  supply = PowerSupplySnapshot(
                      supply_id="USBC",
                      sysfs_path=Path("/synthetic/USBC"),
                      type=ReadResult(A, "USB"),
                      scope=ReadResult(M),
                      online=ReadResult(A, True),
                      status=ReadResult(M),
                      usb_type=ReadResult(A, "PD"),
                      voltage_now=ReadResult(A, 20_000_000),
                      current_now=ReadResult(A, 2_000_000),
                      power_now=ReadResult(M),
                      input_current_limit=ReadResult(A, 3_250_000),
                      input_voltage_limit=ReadResult(M),
                      input_power_limit=ReadResult(A, 65_000_000),
                      capacity=ReadResult(M),
                      capacity_level=ReadResult(M),
                  )
                  return PowerContextSnapshot(
                      power_supply_status=A,
                      typec_status=M,
                      usb_pd_status=M,
                      external_power=ExternalPower.ONLINE,
                      battery_flow=BatteryFlow.UNKNOWN,
                      power_supplies=(supply,),
                      batteries=(),
                      typec_ports=(),
                      usb_pd_objects=(),
                  )

              def test_summary_is_compact_and_does_not_invent_power(self):
                  text = "\n".join(format_power_context_summary(self.snapshot()))
                  self.assertIn("External power: Online", text)
                  self.assertIn("Battery flow: Unknown", text)
                  self.assertIn("USB-PD: Missing", text)
                  self.assertNotIn("40.0 W", text)
                  self.assertNotIn("charger", text.lower())

              def test_debug_preserves_missing_and_formats_exposed_limit(self):
                  text = "\n".join(format_power_context_debug(self.snapshot()))
                  self.assertIn("Power Supply subsystem: Available", text)
                  self.assertIn("USBC", text)
                  self.assertIn("Input power limit: 65.000 W", text)
                  self.assertIn("Power now: Unavailable", text)


          if __name__ == "__main__":
              unittest.main()
          PY

          set +e
          PYTHONPATH="$PWD" python /tmp/auto-cpufreq-power-context-tests/test_power_context_reporting.py > /tmp/task5-red.log 2>&1
          status=$?
          set -e
          cat /tmp/task5-red.log
          if [ "$status" -eq 0 ]; then
            echo "RED gate failed: reporting tests unexpectedly passed before implementation"
            exit 1
          fi
          grep -Eq "format_power_context_debug|format_power_context_summary|cannot import name" /tmp/task5-red.log

      - name: GREEN - integrate PowerContext into reporting only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent


          def block(*lines: str) -> str:
              return "\n".join(lines) + "\n"


          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if text.count(old) != 1:
                  raise SystemExit(f"{label}: expected exactly one match, got {text.count(old)}")
              return text.replace(old, new, 1)


          system_info_path = Path("auto_cpufreq/modules/system_info.py")
          text = system_info_path.read_text()

          old = block(
              "from auto_cpufreq.modules.intel_power import (",
              "    IntelPowerSnapshot,",
              "    ReadStatus,",
              "    intel_power,",
              ")",
          )
          new = old + block(
              "from auto_cpufreq.modules.power_context import (",
              "    BatteryFlow,",
              "    ExternalPower,",
              "    PowerContextDiscovery,",
              "    PowerContextSnapshot,",
              ")",
          )
          text = replace_once(text, old, new, "system_info imports")

          old = block(
              "    platform_profile: PlatformProfileSnapshot = PlatformProfileSnapshot()",
              "    intel_power: IntelPowerSnapshot | None = None",
          )
          new = block(
              "    platform_profile: PlatformProfileSnapshot = PlatformProfileSnapshot()",
              "    intel_power: IntelPowerSnapshot | None = None",
              "    power_context: Optional[PowerContextSnapshot] = None",
          )
          text = replace_once(text, old, new, "SystemReport power_context field")

          old = block(
              "    def generate_system_report(",
              "        self,",
              "        include_intel_power: bool = False,",
              "        sample_intel_energy: bool = False,",
              "    ) -> SystemReport:",
          )
          new = block(
              "    def generate_system_report(",
              "        self,",
              "        include_intel_power: bool = False,",
              "        sample_intel_energy: bool = False,",
              "        include_power_context: bool = False,",
              "    ) -> SystemReport:",
          )
          text = replace_once(text, old, new, "generate_system_report signature")

          old = block(
              "        intel_snapshot = (",
              "            intel_power.snapshot(sample_energy=sample_intel_energy)",
              "            if include_intel_power",
              "            else None",
              "        )",
              "",
              "        return SystemReport(",
          )
          new = block(
              "        intel_snapshot = (",
              "            intel_power.snapshot(sample_energy=sample_intel_energy)",
              "            if include_intel_power",
              "            else None",
              "        )",
              "        power_context_snapshot = (",
              "            power_context_discovery().discover()",
              "            if include_power_context",
              "            else None",
              "        )",
              "",
              "        return SystemReport(",
          )
          text = replace_once(text, old, new, "power context collection")

          old = block(
              "            platform_profile=platform_profile.snapshot(),",
              "            intel_power=intel_snapshot,",
              "        )",
              "",
              "",
              "system_info = SystemInfo()",
          )
          new = block(
              "            platform_profile=platform_profile.snapshot(),",
              "            intel_power=intel_snapshot,",
              "            power_context=power_context_snapshot,",
              "        )",
              "",
              "",
              "def power_context_discovery() -> PowerContextDiscovery:",
              "    sys_root = (",
              "        Path(SNAP_HOST_ROOT) / \"sys\"",
              "        if IS_INSTALLED_WITH_SNAP",
              "        else Path(\"/sys\")",
              "    )",
              "    return PowerContextDiscovery(",
              "        power_supply_root=sys_root / \"class/power_supply\"",
              "        typec_root=sys_root / \"class/typec\"",
              "        usb_pd_root=sys_root / \"class/usb_power_delivery\"",
              "        ignored_supply_substrings=tuple(get_power_supply_ignore_list()),",
              "    )",
              "",
              "",
              "system_info = SystemInfo()",
          )
          text = replace_once(text, old, new, "power context discovery factory")

          marker = block(
              "def format_system_report(",
              "    report: SystemReport,",
              "    include_distro: bool = True,",
              "    include_config: bool = True,",
              ") -> str:",
          )
          formatting = dedent('''\
          def _format_power_read(result, formatter=str) -> str:
              if result.status is ReadStatus.MISSING:
                  return "Unavailable"
              if result.status is ReadStatus.UNREADABLE:
                  return "Could not be read"
              if result.status is ReadStatus.INVALID:
                  return "Invalid"
              if result.value is None:
                  return "Unknown"
              return formatter(result.value)


          def _format_power_subsystem_status(status: ReadStatus) -> str:
              return {
                  ReadStatus.AVAILABLE: "Available",
                  ReadStatus.MISSING: "Missing",
                  ReadStatus.UNREADABLE: "Unreadable",
                  ReadStatus.INVALID: "Invalid",
              }.get(status, "Unknown")


          def _format_external_power(value: ExternalPower) -> str:
              return {
                  ExternalPower.ONLINE: "Online",
                  ExternalPower.OFFLINE: "Offline",
                  ExternalPower.UNKNOWN: "Unknown",
              }[value]


          def _format_battery_flow(value: BatteryFlow) -> str:
              return {
                  BatteryFlow.CHARGING: "Charging",
                  BatteryFlow.DISCHARGING: "Discharging",
                  BatteryFlow.NOT_CHARGING: "Not charging",
                  BatteryFlow.FULL: "Full",
                  BatteryFlow.MIXED: "Mixed",
                  BatteryFlow.UNKNOWN: "Unknown",
              }[value]


          def _format_micro_unit(value: int, unit: str) -> str:
              return f"{value / 1_000_000:.3f} {unit}"


          def _format_yes_no(value: bool) -> str:
              return "Yes" if value else "No"


          def _format_usb_pd_attribute(attribute) -> str:
              if attribute.unit is None:
                  value = _format_power_read(
                      attribute.value,
                      lambda item: _format_yes_no(item)
                      if isinstance(item, bool)
                      else str(item),
                  )
              else:
                  value = _format_power_read(
                      attribute.value,
                      lambda item: f"{item} {attribute.unit}",
                  )
              label = attribute.name.replace("_", " ").capitalize()
              return f"{label}: {value}"


          def format_power_context_debug(snapshot: PowerContextSnapshot) -> list[str]:
              lines = [
                  f"External power: {_format_external_power(snapshot.external_power)}",
                  f"Battery flow: {_format_battery_flow(snapshot.battery_flow)}",
                  "Power Supply subsystem: "
                  + _format_power_subsystem_status(snapshot.power_supply_status),
              ]

              for supply in snapshot.power_supplies:
                  lines.append(f"  {supply.supply_id}")
                  fields = (
                      ("Type", supply.type, str),
                      ("Scope", supply.scope, str),
                      ("Online", supply.online, _format_yes_no),
                      ("Status", supply.status, str),
                      ("USB type", supply.usb_type, str),
                      (
                          "Voltage now",
                          supply.voltage_now,
                          lambda value: _format_micro_unit(value, "V"),
                      ),
                      (
                          "Current now",
                          supply.current_now,
                          lambda value: _format_micro_unit(value, "A"),
                      ),
                      (
                          "Power now",
                          supply.power_now,
                          lambda value: _format_micro_unit(value, "W"),
                      ),
                      (
                          "Input current limit",
                          supply.input_current_limit,
                          lambda value: _format_micro_unit(value, "A"),
                      ),
                      (
                          "Input voltage limit",
                          supply.input_voltage_limit,
                          lambda value: _format_micro_unit(value, "V"),
                      ),
                      (
                          "Input power limit",
                          supply.input_power_limit,
                          lambda value: _format_micro_unit(value, "W"),
                      ),
                      ("Capacity", supply.capacity, lambda value: f"{value}%"),
                      ("Capacity level", supply.capacity_level, str),
                  )
                  for label, result, formatter in fields:
                      lines.append(
                          f"    {label}: {_format_power_read(result, formatter)}"
                      )

              lines.append(
                  "Type-C subsystem: "
                  + _format_power_subsystem_status(snapshot.typec_status)
              )
              for port in snapshot.typec_ports:
                  lines.append(f"  {port.port_id}")
                  lines.append(
                      "    Power role: " + _format_power_read(port.power_role)
                  )
                  lines.append(
                      "    Power operation mode: "
                      + _format_power_read(port.power_operation_mode)
                  )
                  lines.append(
                      "    Partner present: "
                      + _format_power_read(port.partner_present, _format_yes_no)
                  )
                  lines.append(
                      "    Partner USB-PD capable: "
                      + _format_power_read(
                          port.partner_usb_pd_capable,
                          _format_yes_no,
                      )
                  )

              lines.append(
                  "USB Power Delivery subsystem: "
                  + _format_power_subsystem_status(snapshot.usb_pd_status)
              )
              for pd in snapshot.usb_pd_objects:
                  lines.append(f"  {pd.pd_id}")
                  lines.append(f"    Revision: {_format_power_read(pd.revision)}")
                  lines.append(f"    Version: {_format_power_read(pd.version)}")
                  for label, capabilities in (
                      ("Source capabilities", pd.source_capabilities),
                      ("Sink capabilities", pd.sink_capabilities),
                  ):
                      lines.append(f"    {label}:")
                      if not capabilities:
                          lines.append("      None exposed")
                          continue
                      for capability in capabilities:
                          position = (
                              str(capability.position)
                              if capability.position is not None
                              else "?"
                          )
                          lines.append(
                              f"      PDO {position}: {capability.kind.value} "
                              f"({capability.sysfs_name})"
                          )
                          for attribute in capability.attributes:
                              lines.append(
                                  "        " + _format_usb_pd_attribute(attribute)
                              )

              return lines


          def format_power_context_summary(snapshot: PowerContextSnapshot) -> list[str]:
              def counted_status(status: ReadStatus, count: int, noun: str) -> str:
                  if status is ReadStatus.AVAILABLE:
                      return f"Available ({count} {noun})"
                  return _format_power_subsystem_status(status)

              return [
                  f"External power: {_format_external_power(snapshot.external_power)}",
                  f"Battery flow: {_format_battery_flow(snapshot.battery_flow)}",
                  "Type-C: "
                  + counted_status(
                      snapshot.typec_status,
                      len(snapshot.typec_ports),
                      "ports",
                  ),
                  "USB-PD: "
                  + counted_status(
                      snapshot.usb_pd_status,
                      len(snapshot.usb_pd_objects),
                      "objects",
                  ),
              ]


          ''')
          if text.count(marker) != 1:
              raise SystemExit(
                  f"format_system_report marker: expected exactly one match, got {text.count(marker)}"
              )
          text = text.replace(marker, formatting + marker, 1)

          old = block(
              "    if report.intel_power is not None:",
              "        lines.extend(",
              "            [",
              "                \"\",",
              "                \"-\" * 25 + \" Intel Power Diagnostics \" + \"-\" * 25,",
              "                \"\",",
              "            ]",
              "        )",
              "        lines.extend(format_intel_power_summary(report.intel_power))",
              "",
              "    return \"\\n\".join(lines)",
          )
          new = block(
              "    if report.intel_power is not None:",
              "        lines.extend(",
              "            [",
              "                \"\",",
              "                \"-\" * 25 + \" Intel Power Diagnostics \" + \"-\" * 25,",
              "                \"\",",
              "            ]",
              "        )",
              "        lines.extend(format_intel_power_summary(report.intel_power))",
              "",
              "    if report.power_context is not None:",
              "        lines.extend(",
              "            [",
              "                \"\",",
              "                \"-\" * 24 + \" Power Context Diagnostics \" + \"-\" * 24,",
              "                \"\",",
              "            ]",
              "        )",
              "        lines.extend(format_power_context_debug(report.power_context))",
              "",
              "    return \"\\n\".join(lines)",
          )
          text = replace_once(text, old, new, "format_system_report diagnostics")
          system_info_path.write_text(text)

          monitor_path = Path("auto_cpufreq/modules/system_monitor.py")
          text = monitor_path.read_text()
          old = block(
              "    format_intel_power_summary,",
              "    format_platform_profile_summary,",
              "    system_info,",
              ")",
          )
          new = block(
              "    format_intel_power_summary,",
              "    format_platform_profile_summary,",
              "    format_power_context_summary,",
              "    system_info,",
              ")",
          )
          text = replace_once(text, old, new, "system_monitor imports")

          old = block(
              "                report = system_info.generate_system_report(",
              "                    include_intel_power=True,",
              "                    sample_intel_energy=True,",
              "                )",
          )
          new = block(
              "                report = system_info.generate_system_report(",
              "                    include_intel_power=True,",
              "                    sample_intel_energy=True,",
              "                    include_power_context=True,",
              "                )",
          )
          text = replace_once(text, old, new, "STATS collection")

          marker = block(
              "        # System Statistics",
              "        self.right_content.extend(",
          )
          block_text = block(
              "        if self.type == ViewType.STATS and report.power_context is not None:",
              "            self.right_content.append(",
              "                urwid.AttrMap(aligned_text(\"Power Context\"), \"header\")",
              "            )",
              "            for line in format_power_context_summary(report.power_context):",
              "                self.right_content.append(aligned_text(line))",
              "            self.right_content.append(aligned_text(\"\"))",
              "",
          )
          if text.count(marker) != 1:
              raise SystemExit(
                  f"System Statistics marker: expected exactly one match, got {text.count(marker)}"
              )
          text = text.replace(marker, block_text + marker, 1)
          monitor_path.write_text(text)

          cli_path = Path("auto_cpufreq/bin/auto_cpufreq.py")
          text = cli_path.read_text()
          old = block(
              "            report = system_info.generate_system_report(",
              "                include_intel_power=True,",
              "                sample_intel_energy=False,",
              "            )",
          )
          new = block(
              "            report = system_info.generate_system_report(",
              "                include_intel_power=True,",
              "                sample_intel_energy=False,",
              "                include_power_context=True,",
              "            )",
          )
          text = replace_once(text, old, new, "--debug collection")
          cli_path.write_text(text)
          PY

      - name: Verify GREEN and control-path isolation
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD" python /tmp/auto-cpufreq-power-context-tests/test_power_context_reporting.py

          PYTHONPATH="$PWD" python - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory

          from auto_cpufreq.modules.power_context import ExternalPower, PowerContextDiscovery

          with TemporaryDirectory() as td:
              root = Path(td)
              ps = root / "power_supply"
              tc = root / "typec"
              pd = root / "usb_power_delivery"
              ps.mkdir()
              tc.mkdir()
              pd.mkdir()
              source = ps / "ADP1"
              source.mkdir()
              (source / "type").write_text("Mains\n")
              (source / "online").write_text("1\n")
              snapshot = PowerContextDiscovery(ps, tc, pd).discover()
              assert snapshot.external_power is ExternalPower.ONLINE
              assert snapshot.power_supplies[0].supply_id == "ADP1"
          PY

          python -m compileall -q auto_cpufreq
          git diff --check

          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            auto_cpufreq/bin/auto_cpufreq.py \
            auto_cpufreq/modules/system_info.py \
            auto_cpufreq/modules/system_monitor.py | sort)"
          test "$changed" = "$expected"

          test -z "$(git diff --name-only -- \
            auto_cpufreq/modules/policy.py \
            auto_cpufreq/modules/daemon_scheduler.py \
            auto_cpufreq/modules/intel_rapl.py \
            auto_cpufreq/power_helper.py)"

          test "$(grep -c 'include_power_context=True' auto_cpufreq/modules/system_monitor.py)" -eq 1
          test "$(grep -c 'include_power_context=True' auto_cpufreq/bin/auto_cpufreq.py)" -eq 1
          grep -q 'format_power_context_summary' auto_cpufreq/modules/system_monitor.py
          grep -q 'Power Context Diagnostics' auto_cpufreq/modules/system_info.py

          git diff --stat
          git diff -- auto_cpufreq/modules/system_info.py auto_cpufreq/modules/system_monitor.py auto_cpufreq/bin/auto_cpufreq.py

      - name: Commit Task 5 production change to implementation branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Lucas"
          git config user.email "122493239+lucasleocs@users.noreply.github.com"
          git add \
            auto_cpufreq/modules/system_info.py \
            auto_cpufreq/modules/system_monitor.py \
            auto_cpufreq/bin/auto_cpufreq.py
          git commit -m "feat: report power context diagnostics"
          git push origin HEAD:usb-c-power-context
