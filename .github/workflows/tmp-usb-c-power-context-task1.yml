name: Temporary USB-C Power Context Task 3 TDD

on:
  push:
    branches:
      - tmp/usb-c-power-context-tdd

permissions:
  contents: write

jobs:
  task3:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: usb-c-power-context
          fetch-depth: 0

      - name: RED - Type-C tests must fail before implementation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/auto-cpufreq-power-context-tests
          cat > /tmp/auto-cpufreq-power-context-tests/test_typec_context.py <<'PY'
          import unittest
          from pathlib import Path
          from tempfile import TemporaryDirectory

          from auto_cpufreq.modules.power_context import _discover_typec_ports
          from auto_cpufreq.modules.sysfs import ReadStatus


          class TypeCTests(unittest.TestCase):
              def test_numeric_order_roles_partner_and_pd_flag(self):
                  with TemporaryDirectory() as td:
                      root = Path(td)
                      for name, role, mode in (
                          ("port10", "source [sink]", "usb_power_delivery"),
                          ("port2", "[source] sink", "3.0A"),
                      ):
                          port = root / name
                          port.mkdir()
                          (port / "power_role").write_text(role + "\n")
                          (port / "power_operation_mode").write_text(mode + "\n")
                      partner = root / "port10-partner"
                      partner.mkdir()
                      (partner / "supports_usb_power_delivery").write_text("yes\n")

                      status, ports = _discover_typec_ports(root)
                      self.assertEqual(status, ReadStatus.AVAILABLE)
                      self.assertEqual([p.port_id for p in ports], ["port2", "port10"])
                      self.assertEqual(ports[0].power_role.value, "source")
                      self.assertEqual(ports[0].partner_present.value, False)
                      self.assertEqual(ports[0].partner_usb_pd_capable.status, ReadStatus.MISSING)
                      self.assertEqual(ports[1].power_role.value, "sink")
                      self.assertEqual(ports[1].power_operation_mode.value, "usb_power_delivery")
                      self.assertEqual(ports[1].partner_present.value, True)
                      self.assertEqual(ports[1].partner_usb_pd_capable.value, True)

              def test_invalid_partner_flag_is_local(self):
                  with TemporaryDirectory() as td:
                      root = Path(td)
                      port = root / "port0"
                      port.mkdir()
                      (port / "power_role").write_text("sink\n")
                      (port / "power_operation_mode").write_text("usb_power_delivery\n")
                      partner = root / "port0-partner"
                      partner.mkdir()
                      (partner / "supports_usb_power_delivery").write_text("maybe\n")
                      _, ports = _discover_typec_ports(root)
                      self.assertEqual(ports[0].partner_usb_pd_capable.status, ReadStatus.INVALID)
                      self.assertEqual(ports[0].power_operation_mode.value, "usb_power_delivery")

              def test_partner_no_is_false_without_inference(self):
                  with TemporaryDirectory() as td:
                      root = Path(td)
                      port = root / "port0"
                      port.mkdir()
                      (port / "power_role").write_text("sink\n")
                      (port / "power_operation_mode").write_text("usb_power_delivery\n")
                      partner = root / "port0-partner"
                      partner.mkdir()
                      (partner / "supports_usb_power_delivery").write_text("no\n")
                      _, ports = _discover_typec_ports(root)
                      self.assertEqual(ports[0].partner_usb_pd_capable.value, False)
                      self.assertEqual(ports[0].power_operation_mode.value, "usb_power_delivery")

              def test_missing_and_empty_roots_are_distinct(self):
                  with TemporaryDirectory() as td:
                      base = Path(td)
                      missing_status, missing = _discover_typec_ports(base / "missing")
                      empty = base / "empty"
                      empty.mkdir()
                      empty_status, ports = _discover_typec_ports(empty)
                      self.assertEqual(missing_status, ReadStatus.MISSING)
                      self.assertEqual(missing, ())
                      self.assertEqual(empty_status, ReadStatus.AVAILABLE)
                      self.assertEqual(ports, ())


          if __name__ == "__main__":
              unittest.main()
          PY

          set +e
          PYTHONPATH="$PWD" python /tmp/auto-cpufreq-power-context-tests/test_typec_context.py > /tmp/task3-red.log 2>&1
          status=$?
          set -e
          cat /tmp/task3-red.log
          if [ "$status" -eq 0 ]; then
            echo "RED gate failed: Type-C test unexpectedly passed before implementation"
            exit 1
          fi
          grep -q "_discover_typec_ports" /tmp/task3-red.log

      - name: GREEN - implement Type-C discovery
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("auto_cpufreq/modules/power_context.py")
          text = path.read_text()
          marker = "from pathlib import Path\n"
          if marker not in text:
              raise SystemExit("pathlib import marker not found")
          if "import re\n" not in text:
              text = text.replace(marker, marker + "import re\n", 1)
          path.write_text(text)
          PY

          cat >> auto_cpufreq/modules/power_context.py <<'PY'


          @dataclass(frozen=True)
          class TypeCPortSnapshot:
              port_id: str
              sysfs_path: Path
              power_role: ReadResult[str]
              power_operation_mode: ReadResult[str]
              partner_present: ReadResult[bool]
              partner_usb_pd_capable: ReadResult[bool]


          def _read_yes_no(path: Path) -> ReadResult[bool]:
              result = read_text(path)
              if result.status is not ReadStatus.AVAILABLE:
                  return ReadResult(result.status)
              if result.value == "yes":
                  return ReadResult(ReadStatus.AVAILABLE, True)
              if result.value == "no":
                  return ReadResult(ReadStatus.AVAILABLE, False)
              return ReadResult(ReadStatus.INVALID)


          def _read_presence(path: Path) -> ReadResult[bool]:
              try:
                  Path(path).stat()
              except FileNotFoundError:
                  return ReadResult(ReadStatus.AVAILABLE, False)
              except OSError:
                  return ReadResult(ReadStatus.UNREADABLE)
              return ReadResult(ReadStatus.AVAILABLE, True)


          def _typec_port_sort_key(path: Path) -> tuple[int, str]:
              match = re.fullmatch(r"port([0-9]+)", path.name)
              if match is None:
                  return 2**31 - 1, path.name
              return int(match.group(1)), path.name


          def _discover_typec_ports(
              root: Path,
          ) -> tuple[ReadStatus, tuple[TypeCPortSnapshot, ...]]:
              root = Path(root)
              try:
                  entries = [
                      entry
                      for entry in root.iterdir()
                      if re.fullmatch(r"port[0-9]+", entry.name)
                  ]
              except FileNotFoundError:
                  return ReadStatus.MISSING, ()
              except OSError:
                  return ReadStatus.UNREADABLE, ()

              snapshots = []
              for port in sorted(entries, key=_typec_port_sort_key):
                  partner = root / f"{port.name}-partner"
                  partner_present = _read_presence(partner)
                  if (
                      partner_present.status is ReadStatus.AVAILABLE
                      and partner_present.value is True
                  ):
                      partner_usb_pd_capable = _read_yes_no(
                          partner / "supports_usb_power_delivery"
                      )
                  elif partner_present.status is ReadStatus.AVAILABLE:
                      partner_usb_pd_capable = ReadResult(ReadStatus.MISSING)
                  else:
                      partner_usb_pd_capable = ReadResult(partner_present.status)

                  snapshots.append(
                      TypeCPortSnapshot(
                          port_id=port.name,
                          sysfs_path=port,
                          power_role=_active_enum(read_text(port / "power_role")),
                          power_operation_mode=read_text(port / "power_operation_mode"),
                          partner_present=partner_present,
                          partner_usb_pd_capable=partner_usb_pd_capable,
                      )
                  )

              return ReadStatus.AVAILABLE, tuple(snapshots)
          PY

      - name: Verify GREEN and previous power-supply behavior
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD" python /tmp/auto-cpufreq-power-context-tests/test_typec_context.py
          cat > /tmp/auto-cpufreq-power-context-tests/task2-regression.py <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from auto_cpufreq.modules.power_context import ExternalPower, _aggregate_external_power, _discover_power_supplies

          with TemporaryDirectory() as td:
              root = Path(td)
              adp = root / "ADP1"
              adp.mkdir()
              (adp / "type").write_text("Mains\n")
              (adp / "online").write_text("0\n")
              _, supplies = _discover_power_supplies(root)
              assert _aggregate_external_power(supplies) is ExternalPower.OFFLINE
          PY
          PYTHONPATH="$PWD" python /tmp/auto-cpufreq-power-context-tests/task2-regression.py
          python -m compileall -q auto_cpufreq/modules/power_context.py
          git diff --check
          git diff -- auto_cpufreq/modules/power_context.py

      - name: Commit Task 3 production change to implementation branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Lucas"
          git config user.email "122493239+lucasleocs@users.noreply.github.com"
          git add auto_cpufreq/modules/power_context.py
          git commit -m "feat: discover USB Type-C context"
          git push origin HEAD:usb-c-power-context
