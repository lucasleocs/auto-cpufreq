name: PR 985 Final Recovery Audit
on:
  push:
    branches: [lab/pr985-final-recovery, lab/pr985-lifecycle-final-validation, lab/pr985-init-recovery-final-audit]
  workflow_dispatch:
jobs:
  recovery-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run previous lifecycle regression suites
        run: |
          python3 -m unittest discover -s tests -p test_init_service_safety.py -v
          python3 -m unittest discover -s tests -p test_pr975_runit_audit.py -v
          python3 -m unittest discover -s tests -p test_systemd_removal_race.py -v
      - name: Run interruption and preflight safety tests
        run: python3 -m unittest discover -s tests -p test_lifecycle_recovery.py -v
      - name: Test real dinit lifecycle helper error classification
        run: python3 -m unittest discover -s tests -p test_dinit_retries.py -v
      - name: Test read-only shell preflight and missing template handling
        run: python3 -m unittest discover -s tests -p test_install_preflight.py -v
      - name: Test runit replacement and s6 foreign bundle protection
        run: python3 -m unittest discover -s tests -p test_service_poststop_and_s6_bundle.py -v
      - name: Executable script permissions
        run: test -x scripts/auto-cpufreq-install.sh && test -x scripts/auto-cpufreq-remove.sh
      - name: Run isolated s6 execution and prerequisite regressions
        run: |
          python3 -m unittest discover -s tests -p test_install_preflight.py -v
          python3 -m unittest discover -s tests -p test_service_poststop_and_s6_bundle.py -v
      - name: Shell syntax
        run: bash -n scripts/auto-cpufreq-install.sh scripts/auto-cpufreq-remove.sh

  dinit-offline-check:
    runs-on: ubuntu-latest
    steps:
      - name: Examine real dinitctl idempotence without changing host services
        shell: bash
        run: |
          set -eux
          git clone --quiet --depth 1 --branch v0.22.1 https://github.com/davmac314/dinit.git "$RUNNER_TEMP/dinit-source"
          make -C "$RUNNER_TEMP/dinit-source" -j2
          binary="$(find "$RUNNER_TEMP/dinit-source" -type f -name dinitctl -executable -print -quit)"
          test -n "$binary"
          root="$RUNNER_TEMP/dinit-case"
          mkdir -p "$root/boot.d"
          printf 'type = internal\nwaits-for.d: boot.d\n' > "$root/boot"
          printf 'type = internal\n' > "$root/auto-cpufreq"
          set +e
          for op in enable enable disable disable; do
            "$binary" --offline --services-dir "$root" "$op" auto-cpufreq
            status=$?
            echo "DINIT_OFFLINE_RESULT operation=$op status=$status"
          done
          set -e

  runit-offline-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download runit binaries into an isolated directory
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          apt download runit
          mkdir -p "$RUNNER_TEMP/runit-bin"
          dpkg-deb -x runit_*.deb "$RUNNER_TEMP/runit-bin"
          find "$RUNNER_TEMP/runit-bin" -type f \( -name runsv -o -name runsvdir -o -name sv \) -print
      - name: Exercise a real runsvdir service in a disposable process group
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/runit-bin/usr/bin:$RUNNER_TEMP/runit-bin/usr/sbin:$RUNNER_TEMP/runit-bin/bin:$PATH"
          python3 tests/test_runit_live_isolated.py
