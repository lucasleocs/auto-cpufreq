name: Temporary Intel RAPL Final Verification

on:
  push:
    branches:
      - tmp/modern-intel-rapl-final-verification

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile final Intel production surface
        run: >-
          python -m compileall -q
          auto_cpufreq/modules/intel_power.py
          auto_cpufreq/modules/intel_rapl.py
          auto_cpufreq/modules/policy.py
          auto_cpufreq/modules/daemon_scheduler.py
          auto_cpufreq/core.py
          auto_cpufreq/bin/auto_cpufreq.py
          auto_cpufreq/bin/auto_cpufreq_restore_rapl.py
      - name: Install project
        run: python -m pip install .
      - name: Verify installed restore helper
        run: command -v auto-cpufreq-restore-rapl
      - name: Run static RAPL safety audit
        run: PYTHONPATH=. python tmp/test_intel_rapl_static_safety.py
      - name: Run Stage 1 Intel discovery regressions
        run: |
          PYTHONPATH=. python tmp/test_intel_power_task1.py
          PYTHONPATH=. python tmp/test_intel_power_task2.py
          PYTHONPATH=. python tmp/test_intel_power_task3.py
          PYTHONPATH=. python tmp/test_intel_power_task4.py
          PYTHONPATH=. python tmp/test_intel_power_task5.py
          PYTHONPATH=. python tmp/test_intel_power_unnamed_constraint.py
      - name: Run Stage 3 Modern Intel HWP regressions
        run: |
          PYTHONPATH=. python tmp/test_modern_policy_actions.py
          PYTHONPATH=. python tmp/test_modern_hwp_core.py
          PYTHONPATH=. python tmp/test_modern_hwp_dispatch.py
      - name: Run Stage 4 event-loop regression
        run: PYTHONPATH=. python tmp/test_event_loop_final.py
      - name: Run Stage 5 RAPL regressions
        run: |
          PYTHONPATH=. python tmp/test_intel_rapl_config.py
          PYTHONPATH=. python tmp/test_intel_rapl_discovery.py
          PYTHONPATH=. python tmp/test_intel_rapl_state.py
          PYTHONPATH=. python tmp/test_intel_rapl_control.py
          PYTHONPATH=. python tmp/test_intel_rapl_policy_integration.py
          PYTHONPATH=. python tmp/test_intel_rapl_restore_helper.py
