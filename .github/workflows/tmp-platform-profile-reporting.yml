name: Temporary Platform Profile reporting

on:
  push:
    branches:
      - tmp/platform-profile-reporting-972

jobs:
  reporting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project
        run: python -m pip install -e .
      - name: Run temporary reporting checks
        run: python tmp_platform_profile_reporting_check.py
