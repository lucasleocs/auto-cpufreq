name: Temporary Intel RAPL Task 3

on:
  push:
    branches:
      - tmp/modern-intel-rapl-task3

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project dependencies
        run: python -m pip install .
      - name: Compile Intel RAPL module
        run: python -m compileall -q auto_cpufreq/modules/intel_rapl.py
      - name: Run Intel RAPL state contract
        run: PYTHONPATH=. python tmp/test_intel_rapl_state.py
