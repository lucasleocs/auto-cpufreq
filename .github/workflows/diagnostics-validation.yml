name: Diagnostics Validation

on:
  push:
    branches:
      - tmp/debug-diagnostics-validation

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run diagnostics regression checks
        id: regression
        continue-on-error: true
        run: |
          python validation/debug_diagnostics_validation.py > validation-output.txt 2>&1
          echo "status=$?" >> "$GITHUB_OUTPUT"
          cat validation-output.txt

      - name: Upload validation output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-validation-output
          path: validation-output.txt

      - name: Fail on regression
        if: steps.regression.outputs.status != '0'
        run: exit 1
