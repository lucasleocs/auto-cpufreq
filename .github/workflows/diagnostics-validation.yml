name: Diagnostics Validation

on:
  push:
    branches:
      - tmp/debug-diagnostics-validation

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Python syntax
        run: |
          python -m py_compile \
            auto_cpufreq/modules/diagnostics.py \
            auto_cpufreq/bin/auto_cpufreq.py \
            auto_cpufreq/core.py \
            auto_cpufreq/power_state.py

      - name: Verify diff whitespace
        run: git diff --check 9066739ec8577fe7d08afb4a8ddeab84825ba799..HEAD

      - name: Verify baseline fails regression checks
        run: |
          git worktree add --detach /tmp/diagnostics-baseline 9066739ec8577fe7d08afb4a8ddeab84825ba799
          mkdir -p /tmp/diagnostics-baseline/validation
          cp validation/debug_diagnostics_validation.py /tmp/diagnostics-baseline/validation/
          set +e
          (cd /tmp/diagnostics-baseline && python validation/debug_diagnostics_validation.py) > baseline-output.txt 2>&1
          status=$?
          set -e
          cat baseline-output.txt
          if [ "$status" -eq 0 ]; then
            echo "baseline unexpectedly passed diagnostics regression checks"
            exit 1
          fi

      - name: Verify current tree passes regression checks
        run: |
          set -o pipefail
          python validation/debug_diagnostics_validation.py | tee current-output.txt

      - name: Upload validation output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-validation-output
          path: |
            baseline-output.txt
            current-output.txt
