name: Temporary Debug Observability Stage 2

on:
  push:
    branches:
      - tmp/debug-observability-stage2

jobs:
  diagnostics-stage2-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run policy diagnostics contract
        run: >-
          python -m unittest -v
          tmp_tests.test_debug_observability_stage2.CpuFreqPolicyCollectorTests
          tmp_tests.test_debug_observability_stage2.AmdPstateCollectorTests
      - name: Run formatter contract
        run: python -m unittest -v tmp_tests.test_debug_formatter_stage2
      - name: Run service diagnostics contract
        run: >-
          python -m unittest -v
          tmp_tests.test_debug_observability_stage2.PowerServiceCollectorTests
      - name: Run CLI integration contract
        run: python -m unittest -v tmp_tests.test_debug_cli_stage2
      - name: Run static checks
        run: |
          python -m py_compile auto_cpufreq/modules/diagnostics.py auto_cpufreq/bin/auto_cpufreq.py
          git diff --check b00d7ae865d9211a52baffa4887387f5b35b1ce7...HEAD
