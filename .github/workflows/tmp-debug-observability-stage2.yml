name: Temporary Debug Observability Stage 2

on:
  push:
    branches:
      - tmp/debug-observability-stage2

jobs:
  diagnostics-stage2-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run policy diagnostics contract
        run: python -m unittest -v tmp_tests.test_debug_observability_stage2
