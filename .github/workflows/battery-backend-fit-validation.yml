name: Backend selection validation (lab)

on:
  push:
    branches:
      - lab/battery-on-pr985-backend-policy-fit-validation
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime
        run: python -m pip install .
      - name: Validate Python
        run: python -m compileall -q auto_cpufreq internal
      - name: Run mocked battery regressions
        run: python -m unittest discover -s internal -p 'test_*.py' -v
