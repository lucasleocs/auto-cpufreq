name: Backend selection validation (lab)

on:
  push:
    branches:
      - lab/battery-on-pr985-backend-policy-fit-validation
  workflow_dispatch:

jobs:
  tests:
    name: Battery regressions (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install runtime
        run: python -m pip install .
      - name: Validate all Python modules (3.12)
        if: matrix.python-version == '3.12'
        run: python -m compileall -q auto_cpufreq internal
      - name: Validate supported Python 3.9 imports and source
        if: matrix.python-version == '3.9'
        run: |
          python -c "import sys; assert sys.version_info[:2] == (3, 9)"
          python -m compileall -q auto_cpufreq/battery_scripts auto_cpufreq/modules auto_cpufreq/config auto_cpufreq/core.py auto_cpufreq/tlp_stat_parser.py auto_cpufreq/power_helper.py auto_cpufreq/bin/auto_cpufreq.py internal
          python -c "import auto_cpufreq.battery_scripts.battery, auto_cpufreq.modules.report_presentation, auto_cpufreq.modules.report_refresh, auto_cpufreq.modules.report_recommendations, auto_cpufreq.modules.process_health, auto_cpufreq.modules.system_monitor"
          python -m auto_cpufreq.bin.auto_cpufreq --help > /dev/null
      - name: Run mocked battery regressions
        run: python -m unittest discover -s internal -p 'test_*.py' -v

  frontend-integration:
    name: PR 985 frontend, config and inotify regression (lab)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install GTK introspection runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-gi gir1.2-gtk-3.0 python3-venv
      - name: Install Poetry
        run: pipx install poetry
      - name: Install Python runtime with distro GI
        run: |
          poetry config virtualenvs.options.system-site-packages true --local
          poetry env use /usr/bin/python3
          poetry install --no-interaction --no-ansi
      - name: Frontend, inotify, CLI import smoke
        env:
          PYTHONPATH: ${{ github.workspace }}
          XDG_CONFIG_HOME: ${{ runner.temp }}/auto-cpufreq-config
          XDG_STATE_HOME: ${{ runner.temp }}/auto-cpufreq-state
        run: |
          poetry run python -m compileall -q auto_cpufreq tests
          poetry run python -m unittest discover -s tests -p 'test_*.py' -v
          poetry run python -m unittest discover -s tests/regression/issue_860 -p 'test_*.py' -v
          poetry run python -m auto_cpufreq.bin.auto_cpufreq --help > /dev/null
          poetry run python -m auto_cpufreq.power_helper --help > /dev/null
