name: Battery audit regression (experimental)

on:
  push:
    branches:
      - lab/battery-on-pr985-audit-validation
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        run: python -m pip install .
      - name: Compile Python sources
        run: python -m compileall -q auto_cpufreq
      - name: Run battery, inotify integration and terminal presentation tests
        run: python -m unittest discover -s internal -p 'test_*.py' -v
