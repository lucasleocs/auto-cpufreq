name: Frontend candidate regression (lab only)

on:
  push:
    branches:
      - lab/frontend-contribution-validation-20261024
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terminal:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install upstream-compatible dependencies
        run: |
          python -m pip install 'urwid>=3.0.2,<5.0.0' 'psutil>=6,<8' distro pyasyncore
          python -m pip install 'git+https://github.com/shadeyg56/pyinotify-3.12.git'
      - name: Compile candidate and tests
        run: python -m compileall -q auto_cpufreq tests/regression/issue_860
      - name: Exercise selected frontend contracts on original master base
        env:
          PYTHONPATH: tests/regression/issue_860:.
        run: |
          timeout --signal=SIGABRT --kill-after=5s 120s \
            python -u -X faulthandler -m unittest -v \
            test_report_refresh test_report_recommendations test_report_presentation \
            test_urwid_error_semantics test_gui_diagnostics test_shared_diagnostics \
            test_process_health test_sampler test_stats_lifecycle
  gtk:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK and original upstream Python dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-gi python3-venv gir1.2-gtk-3.0 gir1.2-gdkpixbuf-2.0 xvfb xauth
          /usr/bin/python3 -m venv --system-site-packages "$RUNNER_TEMP/frontend-gtk"
          "$RUNNER_TEMP/frontend-gtk/bin/pip" install 'urwid>=3.0.2,<5.0.0' 'psutil>=6,<8' distro pyasyncore
          "$RUNNER_TEMP/frontend-gtk/bin/pip" install 'git+https://github.com/shadeyg56/pyinotify-3.12.git'
      - name: Compile GTK candidate
        run: "$RUNNER_TEMP/frontend-gtk/bin/python -m compileall -q auto_cpufreq tests/regression/issue_860"
      - name: Exercise GTK integration on original master base
        run: |
          xvfb-run -a timeout --signal=SIGABRT --kill-after=5s 120s \
            "$RUNNER_TEMP/frontend-gtk/bin/python" -u -X faulthandler \
            -m unittest discover -s tests/regression/issue_860 \
            -p 'gtk_*_checks.py' -v
